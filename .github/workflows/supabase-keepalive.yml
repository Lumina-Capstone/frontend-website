name: Supabase keep-alive

on:
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check configuration
        id: config
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_KEY" ]; then
            echo "::notice::SUPABASE_URL / SUPABASE_ANON_KEY are not set; skipping keep-alive."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Query Supabase
        if: steps.config.outputs.skip != 'true'
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          url="${SUPABASE_URL%/}/rest/v1/records?select=id&limit=1"
          code=$(curl -sS -o /dev/null -w '%{http_code}' \
            --retry 3 --retry-delay 15 --max-time 30 \
            -H "apikey: $SUPABASE_KEY" \
            -H "Authorization: Bearer $SUPABASE_KEY" \
            "$url")
          if [ "$code" -ge 200 ] && [ "$code" -lt 300 ]; then
            echo "Supabase OK (HTTP $code)"
          else
            echo "::error::Supabase keep-alive failed (HTTP $code). If the project is paused, restore it from the Supabase dashboard, then re-run this workflow."
            exit 1
          fi
